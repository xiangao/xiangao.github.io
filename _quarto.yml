project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/**/*.qmd"

website:
  title: "Xiang Ao"
  site-url: https://xiangao.github.io
  description: "Applied economist and statistician working on causal inference, econometrics, policy evaluation, and open-source statistical software."
  favicon: profile.jpg
  # Root-relative: a bare "profile.jpg" is re-resolved against each page's own
  # URL, which made posts request e.g. /posts/gwg/profile.jpg and 404.
  image: /profile.jpg
  image-alt: "Xiang Ao"
  open-graph: true
  twitter-card: true
  repo-url: https://github.com/xiangao/xiangao.github.io
  navbar:
    left:
      - href: index.qmd
        text: About
      - href: software.qmd
        text: Software
      - href: books.qmd
        text: Online Books
      - href: blogs.qmd
        text: Blogs
    right:
      - icon: github
        href: https://github.com/xiangao

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
